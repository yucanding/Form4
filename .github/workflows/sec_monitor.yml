
name: SEC Form 4 Multi-Channel Monitor

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser curl_cffi beautifulsoup4 yfinance

      - name: Run Monitor
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python main.py

      - name: Save State
        run: |
          git config user.name "sec-bot"
          git config user.email "bot@sec.gov"

          touch processed_ids.txt
          git add processed_ids.txt

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update processed_ids [skip ci]"
            git push
          fi
