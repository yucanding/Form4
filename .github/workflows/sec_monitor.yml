
name: SEC Form 4 Multi-Channel Monitor

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser curl_cffi beautifulsoup4 yfinance

      - name: Run Monitor
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python main.py

      - name: Save State
        run: |
          git config user.name "sec-bot"
          git config user.email "bot@sec.gov"

          touch processed_ids.txt
          git add processed_ids.txt

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update processed_ids [skip ci]"
            git push
          fi

      - name: Notify Telegram on Failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          IFS=',' read -ra CHAT_IDS <<< "$TG_CHAT_ID"

          MESSAGE="🚨 SEC Form 4 Monitor 运行失败！

          Workflow: ${{ github.workflow }}
          Run: #${RUN_NUMBER}

          错误日志：
          ${RUN_URL}"

          for CID in "${CHAT_IDS[@]}"; do
            CID=$(echo "$CID" | xargs)
            [ -z "$CID" ] && continue

            curl --fail-with-body --silent --show-error \
              -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CID}" \
              --data-urlencode "text=${MESSAGE}"
          done
